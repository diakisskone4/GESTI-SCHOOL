# Blueprint Render : https://render.com/docs/blueprint-spec
# Déploie la base PostgreSQL, l'API Django (backend/) et le site React (frontend/).
databases:
  - name: gesti-school-db
    databaseName: gesti_scolaire
    user: gesti
    plan: free

services:
  # --- API Django ---------------------------------------------------------------
  - type: web
    name: gesti-school-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/docs/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      # URL du site frontend, ex: https://gesti-school-web.onrender.com (à saisir dans le dashboard)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SERVE_MEDIA
        value: "true"
      - key: DB_NAME
        fromDatabase: { name: gesti-school-db, property: database }
      - key: DB_USER
        fromDatabase: { name: gesti-school-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: gesti-school-db, property: password }
      - key: DB_HOST
        fromDatabase: { name: gesti-school-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: gesti-school-db, property: port }
      # Compte administrateur créé au premier déploiement (à saisir dans le dashboard)
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_FIRST_NAME
        sync: false
      - key: DJANGO_SUPERUSER_LAST_NAME
        sync: false
    # Pour garder les fichiers uploadés (logos, photos...) entre deux déploiements,
    # passez le service en plan payant (starter) puis décommentez :
    # disk:
    #   name: media
    #   mountPath: /var/data
    #   sizeGB: 1
    # et ajoutez la variable MEDIA_ROOT=/var/data/media

  # --- Frontend React (Vite) ----------------------------------------------------
  - type: web
    name: gesti-school-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # URL de l'API, ex: https://gesti-school-api.onrender.com/api/v1 (à saisir dans le dashboard)
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Application monopage : toutes les URLs (/eleves, /emploi-du-temps...) servent index.html
      - type: rewrite
        source: /*
        destination: /index.html
