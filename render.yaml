# Blueprint Render : https://render.com/docs/blueprint-spec
# Déploie la base PostgreSQL, l'API Django (backend/) et le site React (frontend/).
databases:
  - name: gesti-school-db
    databaseName: gesti_scolaire
    user: gesti
    plan: free

services:
  # --- API Django ---------------------------------------------------------------
  - type: web
    name: gesti-school-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    # Route de santé sans données (la documentation de l'API est réservée aux administrateurs)
    healthCheckPath: /api/v1/sante/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      # Adresse secrète de l'administration Django, ex. « gestion-7f3k9q » (au lieu de /admin/)
      - key: ADMIN_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      # URL du site frontend ET du site vitrine, séparées par des virgules, ex:
      # https://gesti-school-web.onrender.com,https://gesti-school-site.onrender.com (à saisir dans le dashboard)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SERVE_MEDIA
        value: "true"
      - key: DB_NAME
        fromDatabase: { name: gesti-school-db, property: database }
      - key: DB_USER
        fromDatabase: { name: gesti-school-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: gesti-school-db, property: password }
      - key: DB_HOST
        fromDatabase: { name: gesti-school-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: gesti-school-db, property: port }
      # Console de l'équipe développeurs : code secret de l'inscription privée (/equipe/inscription).
      # Laisser vide pour fermer l'inscription une fois l'équipe créée.
      - key: PLATEFORME_CODE_INVITATION
        sync: false
      # Nombre maximum d'établissements sur ce déploiement
      - key: PLATEFORME_MAX_ETABLISSEMENTS
        value: "50"
      # Compte administrateur créé au premier déploiement (à saisir dans le dashboard)
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_FIRST_NAME
        sync: false
      - key: DJANGO_SUPERUSER_LAST_NAME
        sync: false
    # Pour garder les fichiers uploadés (logos, photos...) entre deux déploiements,
    # passez le service en plan payant (starter) puis décommentez :
    # disk:
    #   name: media
    #   mountPath: /var/data
    #   sizeGB: 1
    # et ajoutez la variable MEDIA_ROOT=/var/data/media

  # --- Frontend React (Vite) ----------------------------------------------------
  - type: web
    name: gesti-school-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # URL de l'API, ex: https://gesti-school-api.onrender.com/api/v1 (à saisir dans le dashboard)
      - key: VITE_API_BASE_URL
        sync: false
    headers:
      # En-têtes de sécurité : pas d'affichage dans un cadre (clickjacking), pas de script externe ou en ligne,
      # connexions limitées à l'API Render (empêche l'envoi des données vers un autre site en cas de faille)
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.onrender.com; frame-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    routes:
      # Application monopage : toutes les URLs (/eleves, /emploi-du-temps...) servent index.html
      - type: rewrite
        source: /*
        destination: /index.html

  # --- Site vitrine (publicité) : HTML/CSS/JS simples, dossier site/ ---------------------
  - type: web
    name: gesti-school-site
    runtime: static
    rootDir: site
    buildCommand: echo "Site statique, aucune construction"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      # Les images ne changent pas souvent : mises en cache une semaine par les navigateurs
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
